<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEMESIS CLIENT</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: rgba(18, 22, 31, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #a855f7;
      --primary-glow: rgba(168, 85, 247, 0.4);
      --emerald: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.4);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Arka Plan Ambient Işıkları */
    .bg-glow-1 {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
      top: 20%;
      left: 30%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1;
    }

    .bg-glow-2 {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
      bottom: 10%;
      right: 25%;
      transform: translate(50%, 50%);
      pointer-events: none;
      z-index: 1;
    }

    /* Izgara Deseni Arka Planı */
    .grid-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 1;
      pointer-events: none;
    }

    /* Intro Ekranı */
    #intro {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #050608;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      animation: fadeOut 0.8s cubic-bezier(0.16, 1, 0.3, 1) 2.2s forwards;
    }

    .intro-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 3.5rem;
      font-weight: 900;
      letter-spacing: 12px;
      background: linear-gradient(135deg, #ffffff 0%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px var(--primary-glow);
      animation: pulse 1.5s ease-in-out infinite alternate;
    }

    /* Ana Kart Container */
    #main-content {
      position: relative;
      z-index: 2;
      opacity: 0;
      animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 2.8s forwards;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 3rem 2.5rem;
      border-radius: 24px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4),
                  inset 0 1px 0 rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 380px;
    }

    .client-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .client-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 4px;
      color: #fff;
      margin-bottom: 6px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      font-size: 0.75rem;
      color: var(--emerald);
      font-weight: 500;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--emerald);
      box-shadow: 0 0 8px var(--emerald);
    }

    /* Düğmeler Gruplaması */
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
    }

    .btn {
      position: relative;
      width: 100%;
      padding: 0.9rem 1.2rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-main);
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      outline: none;
    }

    .btn-content {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-tag {
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      font-weight: 700;
    }

    /* Primary Button (Client Download) */
    .btn-primary {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.2) 0%, rgba(126, 34, 206, 0.2) 100%);
      border-color: rgba(168, 85, 247, 0.4);
      color: #fff;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.4) 0%, rgba(126, 34, 206, 0.4) 100%);
      border-color: var(--primary);
      box-shadow: 0 0 20px var(--primary-glow);
      transform: translateY(-2px);
    }

    /* Secondary Button (Source File) */
    .btn-emerald {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.15) 0%, rgba(5, 150, 105, 0.15) 100%);
      border-color: rgba(16, 185, 129, 0.3);
      color: #fff;
    }

    .btn-emerald:hover {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.3) 0%, rgba(5, 150, 105, 0.3) 100%);
      border-color: var(--emerald);
      box-shadow: 0 0 20px var(--emerald-glow);
      transform: translateY(-2px);
    }

    /* External Links (GitHub & YouTube) */
    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.25);
      color: #fff;
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0) scale(0.98) !important;
    }

    /* Animasyonlar */
    @keyframes pulse {
      0% { transform: scale(0.98); opacity: 0.8; }
      100% { transform: scale(1.02); opacity: 1; }
    }

    @keyframes fadeOut {
      to { opacity: 0; visibility: hidden; }
    }

    @keyframes fadeIn {
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="grid-bg"></div>
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <!-- Intro Ekranı -->
  <div id="intro">
    <h1 class="intro-title">NEMESIS</h1>
  </div>

  <!-- Ana İndirme Ekranı -->
  <div id="main-content">
    <div class="glass-card">
      
      <div class="client-header">
        <h2 class="client-title">NEMESIS</h2>
        <div class="status-badge">
          <span class="status-dot"></span>
          <span>v1.0 ONLINE</span>
        </div>
      </div>

      <div class="btn-container">
        <!-- ZIP Client İndirme Tuşu -->
        <a href="https://raw.githubusercontent.com/utkunoobie/NEMESIS/main/NEMESIS.zip" download class="btn btn-primary">
          <div class="btn-content">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            <span class="btn-text">DOWNLOAD CLIENT</span>
          </div>
          <span class="btn-tag">ZIP</span>
        </a>

        <!-- Python Kaynak Kodu İndirme Tuşu -->
        <a href="https://github.com/utkunoobie/NEMESIS/raw/main/main.py" download class="btn btn-emerald">
          <div class="btn-content">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
            <span class="btn-text">SOURCE CODE</span>
          </div>
          <span class="btn-tag">PY</span>
        </a>

        <!-- GitHub Yönlendirme Tuşu -->
        <a href="https://github.com/utkunoobie/NEMESIS" target="_blank" class="btn btn-outline">

            <span>GITHUB</span>
          </div>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>

        <!-- YouTube Yönlendirme Tuşu -->
        <a href="https://www.youtube.com/@utkunoob" target="_blank" class="btn btn-outline">

            <span>YOUTUBE</span>
          </div>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>

      </div>

    </div>
  </div>

</body>
</html>
